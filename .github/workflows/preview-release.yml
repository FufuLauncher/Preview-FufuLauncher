name: Preview Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

env:
  BUILD_CONFIGURATION: Release
  MAIN_REPO: FufuLauncher/FufuLauncher
  UNLOCKER_REPO: FufuLauncher/FufuLauncher.UnlockerIsland
  CAPTURE_REPO: FufuLauncher/FufuLauncher.CaptureApp
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Resolve FufuLauncher HEAD commit
        id: meta
        shell: bash
        run: |
          sha=$(git ls-remote "https://github.com/${MAIN_REPO}.git" HEAD | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::Failed to resolve HEAD commit of ${MAIN_REPO}"
            exit 1
          fi
          short_sha="${sha:0:7}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "::notice::FufuLauncher commit: ${sha} (${short_sha})"

  build-main:
    name: Build FufuLauncher
    needs: prepare
    runs-on: windows-latest
    outputs:
      output_dir: ${{ steps.locate.outputs.output_dir }}
    steps:
      - name: Checkout FufuLauncher
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build FufuLauncher
        run: dotnet build FufuLauncher\FufuLauncher.csproj -c ${{ env.BUILD_CONFIGURATION }} /p:Platform="x64"

      - name: Locate build output directory
        id: locate
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path "FufuLauncher\bin" -Recurse -Directory |
                 Where-Object { $_.FullName -match "${{ env.BUILD_CONFIGURATION }}" -and $_.FullName -match "net8.0-windows" } |
                 Select-Object -First 1
          if (-not $dir) {
              Write-Output "::error::Failed to locate FufuLauncher build output directory"
              exit 1
          }
          $rel = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $dir.FullName).Replace('\', '/')
          "output_dir=$rel" >> $env:GITHUB_OUTPUT
          Write-Output "Build output directory: $rel"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: main-build
          path: ${{ steps.locate.outputs.output_dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-updater:
    name: Build UpdateFufuLauncher
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout FufuLauncher
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish UpdateFufuLauncher (single file)
        run: |
          dotnet publish UpdateFufuLauncher\UpdateFufuLauncher.csproj -c ${{ env.BUILD_CONFIGURATION }} /p:Platform="x64" -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DeleteExistingFiles=true -o PublishOutput

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: updater-build
          path: PublishOutput
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-unlocker:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: UnlockerIsland
            project: FufuLauncher.UnlockerIsland\FufuLauncher.UnlockerIsland.vcxproj
            toolset: v145
            output: FufuLauncher.UnlockerIsland.dll
          - name: Launcher
            project: Launcher\Launcher.vcxproj
            toolset: v143
            output: Launcher.dll
          - name: Launcher_2
            project: Launcher_2\Launcher_2.vcxproj
            toolset: v143
            output: Launcher_2.exe
    steps:
      - name: Checkout FufuLauncher.UnlockerIsland
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UNLOCKER_REPO }}
          path: FufuLauncher.UnlockerIsland_Repo

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: 17.8
          msbuild-architecture: x64

      - name: Build ${{ matrix.name }}
        run: msbuild "FufuLauncher.UnlockerIsland_Repo\${{ matrix.project }}" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ matrix.toolset }}

      - name: Collect ${{ matrix.output }}
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "${{ matrix.output }}" -Recurse |
                  Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } |
                  Select-Object -First 1
          if (-not $file) {
              Write-Output "::error::Failed to locate build artifact ${{ matrix.output }}"
              exit 1
          }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item -Path $file.FullName -Destination "staging\${{ matrix.output }}" -Force
          Write-Output "Collected $($file.FullName)"

      - name: Install UPX
        run: choco install upx --no-progress -y

      - name: Compress ${{ matrix.output }} with UPX
        run: upx --best "staging\${{ matrix.output }}"

      - name: Upload ${{ matrix.output }}
        uses: actions/upload-artifact@v4
        with:
          name: unlocker-${{ matrix.name }}
          path: staging/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  build-capture:
    name: Build CaptureApp
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout FufuLauncher.CaptureApp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CAPTURE_REPO }}
          path: FufuLauncher.CaptureApp_Repo

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: 17.8
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore FufuLauncher.CaptureApp_Repo\CaptureApp.sln

      - name: Build CaptureApp
        run: msbuild FufuLauncher.CaptureApp_Repo\CaptureApp.sln /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Collect CaptureApp.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "FufuLauncher.CaptureApp_Repo" -Filter "CaptureApp.exe" -Recurse |
                 Where-Object { $_.FullName -match "Release" } |
                 Select-Object -First 1
          if (-not $exe) {
              Write-Output "::error::Failed to locate build artifact CaptureApp.exe"
              exit 1
          }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item -Path $exe.FullName -Destination "staging\CaptureApp.exe" -Force

      - name: Upload CaptureApp.exe
        uses: actions/upload-artifact@v4
        with:
          name: capture-build
          path: staging/CaptureApp.exe
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble
    needs: [prepare, build-main, build-updater, build-unlocker, build-capture]
    runs-on: windows-latest
    env:
      OUTPUT_DIR: ${{ needs.build-main.outputs.output_dir }}
    steps:
      - name: Download FufuLauncher build
        uses: actions/download-artifact@v4
        with:
          name: main-build
          path: ${{ env.OUTPUT_DIR }}

      - name: Download UnlockerIsland builds
        uses: actions/download-artifact@v4
        with:
          pattern: unlocker-*
          path: artifacts/unlocker
          merge-multiple: true

      - name: Download CaptureApp build
        uses: actions/download-artifact@v4
        with:
          name: capture-build
          path: artifacts/capture

      - name: Download UpdateFufuLauncher build
        uses: actions/download-artifact@v4
        with:
          name: updater-build
          path: artifacts/updater

      - name: Merge build artifacts
        shell: pwsh
        run: |
          $out = $env:OUTPUT_DIR
          $pluginDir = "$out/Plugins/FuFuPlugin"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          $copies = @(
              @{ Src = "artifacts/unlocker/Launcher.dll";                    Dst = "$out/Launcher.dll" },
              @{ Src = "artifacts/unlocker/Launcher_2.exe";                  Dst = "$out/Launcher_2.exe" },
              @{ Src = "artifacts/unlocker/FufuLauncher.UnlockerIsland.dll"; Dst = "$pluginDir/FufuLauncher.UnlockerIsland.dll" },
              @{ Src = "artifacts/capture/CaptureApp.exe";                   Dst = "$out/CaptureApp.exe" }
          )
          foreach ($c in $copies) {
              if (-not (Test-Path $c.Src)) {
                  Write-Output "::error::Missing build artifact: $($c.Src)"
                  exit 1
              }
              Copy-Item -Path $c.Src -Destination $c.Dst -Force
              Write-Output "Copied $($c.Src) -> $($c.Dst)"
          }

          Copy-Item -Path "artifacts/updater/*" -Destination $out -Force -Recurse
          Write-Output "Copied UpdateFufuLauncher publish output to $out"

      - name: Regenerate hash.txt
        shell: pwsh
        run: |
          $outputDir = $env:OUTPUT_DIR
          $hashFile = Join-Path $outputDir "Assets\Launcher\hash.txt"
          $captureApp = Join-Path $outputDir "CaptureApp.exe"
          $launcher = Join-Path $outputDir "Launcher.dll"

          [string[]]$existingLines = @()
          if (Test-Path $hashFile) {
              $existingLines = Get-Content $hashFile -ErrorAction SilentlyContinue
          }

          $line1 = if ($existingLines.Count -gt 0) { $existingLines[0] } else { "" }
          $line2 = if (Test-Path $captureApp) { (Get-FileHash $captureApp -Algorithm SHA512).Hash.ToLower() } else { "" }
          $line3 = if (Test-Path $launcher) { (Get-FileHash $launcher -Algorithm SHA512).Hash.ToLower() } else { "" }

          $hashDir = Split-Path $hashFile -Parent
          if (-not (Test-Path $hashDir)) { New-Item -ItemType Directory -Force -Path $hashDir | Out-Null }

          Set-Content -Path $hashFile -Value @($line1, $line2, $line3)
          Write-Output "Updated hash.txt with UPX-compressed file hashes"

      - name: Upload assembled output
        uses: actions/upload-artifact@v4
        with:
          name: assembled-output
          path: ${{ env.OUTPUT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload plugin files
        uses: actions/upload-artifact@v4
        with:
          name: plugin-files
          path: ${{ env.OUTPUT_DIR }}/Plugins/FuFuPlugin
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package-installer:
    name: Package Installer
    needs: [prepare, build-main, assemble]
    runs-on: windows-latest
    outputs:
      exe_name: ${{ steps.meta.outputs.exe_name }}
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
    env:
      OUTPUT_DIR: ${{ needs.build-main.outputs.output_dir }}
    steps:
      - name: Checkout FufuLauncher
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download assembled output
        uses: actions/download-artifact@v4
        with:
          name: assembled-output
          path: ${{ env.OUTPUT_DIR }}

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --no-progress -y
          }

      - name: Compile Inno Setup script
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" FufuLauncher.Installer\setup.iss'

      - name: Rename installer and prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path "FufuLauncher.Installer\installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $exeFile) {
              Write-Output "::error::No installer executable found in FufuLauncher.Installer\installer"
              exit 1
          }

          $shortSha = "${{ needs.prepare.outputs.short_sha }}"

          if ($exeFile.BaseName -match '(v?\d+(?:\.\d+)+)') {
              $version = $matches[1]
          } else {
              $version = $exeFile.BaseName -replace '^FufuLauncher_Setup_', ''
          }

          $releaseTag = "${version}-${shortSha}"
          $releaseTitle = "preview-${version}-${shortSha}"
          $newExeName = "(preview-${shortSha})$($exeFile.Name)"

          New-Item -ItemType Directory -Force -Path installer-staging | Out-Null
          Move-Item -LiteralPath $exeFile.FullName -Destination "installer-staging\$newExeName" -Force

          "exe_name=$([System.IO.Path]::GetFileNameWithoutExtension($newExeName))" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT

          "### Preview Build Successful" >> $env:GITHUB_STEP_SUMMARY
          "- **Release Tag**: ``$releaseTag``" >> $env:GITHUB_STEP_SUMMARY
          "- **Release Title**: ``$releaseTitle``" >> $env:GITHUB_STEP_SUMMARY
          "- **Generated Installer**: **$newExeName**" >> $env:GITHUB_STEP_SUMMARY

      - name: Create unsigned MSIX package
        shell: pwsh
        run: |
          $stagingDir = Join-Path $env:RUNNER_TEMP "FufuLauncher-MSIX"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          robocopy $env:OUTPUT_DIR $stagingDir /E /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) {
              Write-Output "::error::Failed to stage assembled files for MSIX (robocopy exit code $LASTEXITCODE)"
              exit 1
          }
          if (-not (Test-Path (Join-Path $stagingDir "FufuLauncher.exe"))) {
              Write-Output "::error::FufuLauncher.exe is missing from the assembled output"
              exit 1
          }

          $assetsDir = Join-Path $stagingDir "Assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          Add-Type -AssemblyName System.Drawing
          $sourceIcon = Join-Path $env:GITHUB_WORKSPACE "FufuLauncher\Assets\icon.png"
          if (-not (Test-Path $sourceIcon)) {
              Write-Output "::error::FufuLauncher\Assets\icon.png is missing"
              exit 1
          }
          $sourceImage = [System.Drawing.Image]::FromFile($sourceIcon)
          try {
              $side = [Math]::Min($sourceImage.Width, $sourceImage.Height)
              $sourceRect = [System.Drawing.Rectangle]::new(
                  [int](($sourceImage.Width - $side) / 2),
                  [int](($sourceImage.Height - $side) / 2),
                  $side,
                  $side
              )
              foreach ($size in @(150, 44)) {
                  $bitmap = [System.Drawing.Bitmap]::new($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
                  $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                  try {
                      $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                      $graphics.DrawImage($sourceImage, [System.Drawing.Rectangle]::new(0, 0, $size, $size), $sourceRect, [System.Drawing.GraphicsUnit]::Pixel)
                      $bitmap.Save((Join-Path $assetsDir "Square${size}x${size}Logo.png"), [System.Drawing.Imaging.ImageFormat]::Png)
                  } finally {
                      $graphics.Dispose()
                      $bitmap.Dispose()
                  }
              }
          } finally {
              $sourceImage.Dispose()
          }

          $version = "${{ steps.meta.outputs.version }}"
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package
              xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
              xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
              xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
              IgnorableNamespaces="uap rescap">
              <Identity Name="FufuLauncher.Preview" Publisher="CN=FufuLauncher" Version="$version" ProcessorArchitecture="x64" />
              <Properties>
                  <DisplayName>FufuLauncher Preview</DisplayName>
                  <PublisherDisplayName>FufuLauncher</PublisherDisplayName>
                  <Logo>Assets\Square150x150Logo.png</Logo>
              </Properties>
              <Dependencies>
                  <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
              </Dependencies>
              <Resources>
                  <Resource Language="en-US" />
              </Resources>
              <Applications>
                  <Application Id="FufuLauncher" Executable="FufuLauncher.exe" EntryPoint="Windows.FullTrustApplication">
                      <uap:VisualElements DisplayName="FufuLauncher Preview" Description="FufuLauncher Preview" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />
                  </Application>
              </Applications>
              <Capabilities>
                  <rescap:Capability Name="runFullTrust" />
              </Capabilities>
          </Package>
          "@
          $manifestPath = Join-Path $stagingDir "AppxManifest.xml"
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))

          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\MakeAppx.exe" |
                      Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
                      Select-Object -First 1
          if (-not $makeAppx) {
              Write-Output "::error::MakeAppx.exe was not found in the installed Windows SDK"
              exit 1
          }

          $shortSha = "${{ needs.prepare.outputs.short_sha }}"
          $msixPath = Join-Path $env:GITHUB_WORKSPACE "installer-staging\FufuLauncher-Preview-$shortSha.msix"
          & $makeAppx.FullName pack /d $stagingDir /p $msixPath /o
          if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::MakeAppx failed to create the MSIX package"
              exit $LASTEXITCODE
          }

          Write-Output "Created unsigned MSIX: $msixPath"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.exe_name }}
          path: installer-staging/*.exe
          if-no-files-found: error

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: FufuLauncher-MSIX
          path: installer-staging/*.msix
          if-no-files-found: error

  package-portable:
    name: Package Portable ZIP
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Download assembled output
        uses: actions/download-artifact@v4
        with:
          name: assembled-output
          path: portable

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "portable/*" -DestinationPath "FufuLauncher-Portable.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FufuLauncher-Portable
          path: FufuLauncher-Portable.zip
          if-no-files-found: error

  package-plugin:
    name: Package FuFuPlugin
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin files
        uses: actions/download-artifact@v4
        with:
          name: plugin-files
          path: plugin

      - name: Create FuFuPlugin bundle
        shell: pwsh
        run: |
          $pluginDir = "plugin"
          $stagingDir = "PluginStaging"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          if (Test-Path "$pluginDir/*") {
              Compress-Archive -Path "$pluginDir/*" -DestinationPath "$stagingDir/FuFuPlugin.zip" -Force
              Copy-Item -Path "$stagingDir/FuFuPlugin.zip" -Destination "$stagingDir/FuFuPlugin-old.zip" -Force
              Copy-Item -Path "$stagingDir/FuFuPlugin.zip" -Destination "$stagingDir/FuFuPlugin.vmp.zip" -Force
              Copy-Item -Path "$stagingDir/FuFuPlugin.zip" -Destination "$stagingDir/FuFuPlugin.vmp2.zip" -Force
              Compress-Archive -Path "$stagingDir/*.zip" -DestinationPath "FuFuPlugin_Bundle.zip" -Force
          } else {
              Write-Output "::warning::FuFuPlugin directory is empty or does not exist"
              New-Item -ItemType File -Force -Path "FuFuPlugin_Bundle.zip" | Out-Null
          }

      - name: Upload FuFuPlugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: FuFuPlugin-Bundle
          path: FuFuPlugin_Bundle.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [prepare, package-installer, package-portable, package-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-installer.outputs.exe_name }}
          path: release-assets

      - name: Download MSIX package
        uses: actions/download-artifact@v4
        with:
          name: FufuLauncher-MSIX
          path: release-assets

      - name: Download portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: FufuLauncher-Portable
          path: release-assets

      - name: Download FuFuPlugin bundle
        uses: actions/download-artifact@v4
        with:
          name: FuFuPlugin-Bundle
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.package-installer.outputs.release_tag }}
          name: ${{ needs.package-installer.outputs.release_title }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  summary:
    name: Pipeline Summary
    if: always()
    needs:
      - prepare
      - build-main
      - build-updater
      - build-unlocker
      - build-capture
      - assemble
      - package-installer
      - package-portable
      - package-plugin
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        shell: bash
        env:
          R_PREPARE: ${{ needs.prepare.result }}
          R_MAIN: ${{ needs.build-main.result }}
          R_UPDATER: ${{ needs.build-updater.result }}
          R_UNLOCKER: ${{ needs.build-unlocker.result }}
          R_CAPTURE: ${{ needs.build-capture.result }}
          R_ASSEMBLE: ${{ needs.assemble.result }}
          R_INSTALLER: ${{ needs.package-installer.result }}
          R_PORTABLE: ${{ needs.package-portable.result }}
          R_PLUGIN: ${{ needs.package-plugin.result }}
          R_RELEASE: ${{ needs.release.result }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.package-installer.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          cls() {
            case "$1" in
              success)   echo "ok" ;;
              failure)   echo "failed" ;;
              cancelled) echo "cancelled" ;;
              *)         echo "skipped" ;;
            esac
          }

          {
            echo "## Pipeline Summary"
            echo ""
            echo "- **Commit**: \`${SHA:-unknown}\`"
            if [ "$R_RELEASE" = "success" ]; then
              echo "- **Release**: https://github.com/${REPO}/releases/tag/${TAG}"
            fi
            echo ""
            echo '```mermaid'
            echo 'flowchart LR'
            echo '  P[Prepare] --> M[Build FufuLauncher]'
            echo '  P --> U[Build UpdateFufuLauncher]'
            echo '  P --> I["Build UnlockerIsland (x3)"]'
            echo '  P --> C[Build CaptureApp]'
            echo '  M --> A[Assemble]'
            echo '  U --> A'
            echo '  I --> A'
            echo '  C --> A'
            echo '  A --> S["Package Setup + MSIX"]'
            echo '  A --> Z[Package Portable ZIP]'
            echo '  A --> G[Package FuFuPlugin]'
            echo '  S --> R[Publish Release]'
            echo '  Z --> R'
            echo '  G --> R'
            echo '  classDef ok fill:#2da44e,stroke:#1a7f37,color:#ffffff'
            echo '  classDef failed fill:#cf222e,stroke:#a40e26,color:#ffffff'
            echo '  classDef cancelled fill:#9a6700,stroke:#7d4e00,color:#ffffff'
            echo '  classDef skipped fill:#8c959f,stroke:#6e7781,color:#ffffff'
            echo "  class P $(cls "$R_PREPARE")"
            echo "  class M $(cls "$R_MAIN")"
            echo "  class U $(cls "$R_UPDATER")"
            echo "  class I $(cls "$R_UNLOCKER")"
            echo "  class C $(cls "$R_CAPTURE")"
            echo "  class A $(cls "$R_ASSEMBLE")"
            echo "  class S $(cls "$R_INSTALLER")"
            echo "  class Z $(cls "$R_PORTABLE")"
            echo "  class G $(cls "$R_PLUGIN")"
            echo "  class R $(cls "$R_RELEASE")"
            echo '```'
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Prepare | ${R_PREPARE} |"
            echo "| Build FufuLauncher | ${R_MAIN} |"
            echo "| Build UpdateFufuLauncher | ${R_UPDATER} |"
            echo "| Build UnlockerIsland (matrix) | ${R_UNLOCKER} |"
            echo "| Build CaptureApp | ${R_CAPTURE} |"
            echo "| Assemble | ${R_ASSEMBLE} |"
            echo "| Package Setup + MSIX | ${R_INSTALLER} |"
            echo "| Package Portable ZIP | ${R_PORTABLE} |"
            echo "| Package FuFuPlugin | ${R_PLUGIN} |"
            echo "| Publish Release | ${R_RELEASE} |"
          } >> "$GITHUB_STEP_SUMMARY"
