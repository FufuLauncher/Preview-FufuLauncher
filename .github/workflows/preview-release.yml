name: Preview Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout FufuLauncher Main Repo
      uses: actions/checkout@v4
      with:
        repository: FufuLauncher/FufuLauncher
        fetch-depth: 0

    - name: Get Git Short Hash
      shell: pwsh
      run: |
        $shortSha = (git rev-parse --short HEAD).Trim()
        Write-Output "GIT_SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
        Write-Host "Latest FufuLauncher Git Short SHA: $shortSha"

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: 17.8
        msbuild-architecture: x64

    - name: Build FufuLauncher
      run: dotnet build FufuLauncher\FufuLauncher.csproj -c ${{ matrix.configuration }} /p:Platform="x64"

    - name: Get Build Output Directory
      id: get-output-dir
      shell: pwsh
      run: |
        $fufuOutputDir = Get-ChildItem -Path "FufuLauncher\bin" -Recurse -Directory | Where-Object { $_.FullName -match "${{ matrix.configuration }}" -and $_.FullName -match "net8.0-windows" } | Select-Object -First 1
        if ($fufuOutputDir) {
            Write-Output "OUTPUT_DIR=$($fufuOutputDir.FullName)" >> $env:GITHUB_ENV
        } else {
            Write-Error "未能定位到FufuLauncher的构建输出目录"
            exit 1
        }

    - name: Checkout FufuLauncher.UnlockerIsland
      uses: actions/checkout@v4
      with:
        repository: FufuLauncher/FufuLauncher.UnlockerIsland
        path: FufuLauncher.UnlockerIsland_Repo

    - name: Build UnlockerIsland Projects
      run: |
        msbuild FufuLauncher.UnlockerIsland_Repo\FufuLauncher.UnlockerIsland\FufuLauncher.UnlockerIsland.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145
        msbuild FufuLauncher.UnlockerIsland_Repo\Launcher\Launcher.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
        msbuild FufuLauncher.UnlockerIsland_Repo\Launcher_2\Launcher_2.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Replace Executables and Copy Plugin
      shell: pwsh
      run: |
        $baseOutputDir = "${{ env.OUTPUT_DIR }}"

        $launcherDll = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "Launcher.dll" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } | Select-Object -First 1
        $launcher2Exe = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "Launcher_2.exe" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } | Select-Object -First 1

        if ($launcherDll -and $launcher2Exe) {
            Copy-Item -Path $launcherDll.FullName -Destination "$baseOutputDir\Launcher.dll" -Force
            Copy-Item -Path $launcher2Exe.FullName -Destination "$baseOutputDir\Launcher_2.exe" -Force
            Write-Host "成功替换Launcher.dll和Launcher_2.exe"
        } else {
            Write-Error "未能定位到Launcher.dll或Launcher_2.exe编译产物"
            exit 1
        }

        $pluginOutputDir = "$baseOutputDir\Plugins\FuFuPlugin"
        New-Item -ItemType Directory -Force -Path $pluginOutputDir | Out-Null
        $unlockerDll = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "FufuLauncher.UnlockerIsland.dll" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } | Select-Object -First 1
        
        if ($unlockerDll) {
            Copy-Item -Path $unlockerDll.FullName -Destination "$pluginOutputDir\FufuLauncher.UnlockerIsland.dll" -Force
            Write-Host "成功复制FufuLauncher.UnlockerIsland.dll至插件目录"
        } else {
            Write-Error "未能定位到FufuLauncher.UnlockerIsland.dll编译产物"
            exit 1
        }

    - name: Checkout FufuLauncher.CaptureApp
      uses: actions/checkout@v4
      with:
        repository: FufuLauncher/FufuLauncher.CaptureApp
        path: FufuLauncher.CaptureApp_Repo

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore CaptureApp NuGet Packages
      run: nuget restore FufuLauncher.CaptureApp_Repo\CaptureApp.sln

    - name: Build CaptureApp
      run: msbuild FufuLauncher.CaptureApp_Repo\CaptureApp.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Replace CaptureApp.exe
      shell: pwsh
      run: |
        $baseOutputDir = "${{ env.OUTPUT_DIR }}"
        $captureAppExe = Get-ChildItem -Path "FufuLauncher.CaptureApp_Repo" -Filter "CaptureApp.exe" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
        
        if ($captureAppExe) {
            Copy-Item -Path $captureAppExe.FullName -Destination "$baseOutputDir\CaptureApp.exe" -Force
            Write-Host "成功替换CaptureApp.exe"
        } else {
            Write-Error "未能定位到CaptureApp.exe编译产物"
            exit 1
        }

    - name: Publish UpdateFufuLauncher (Single File)
      run: |
        dotnet publish UpdateFufuLauncher\UpdateFufuLauncher.csproj -c ${{ matrix.configuration }} /p:Platform="x64" -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DeleteExistingFiles=true -o PublishOutput

    - name: Move UpdateFufuLauncher to FufuLauncher build directory
      shell: pwsh
      run: |
        $fufuOutputDir = "${{ env.OUTPUT_DIR }}"
        Copy-Item -Path "PublishOutput\*" -Destination $fufuOutputDir -Force -Recurse
        Write-Host "已将UpdateFufuLauncher的发布产物移动至$fufuOutputDir"

    - name: Install UPX
      run: choco install upx --no-progress

    - name: Compress Executables and DLLs with UPX
      shell: pwsh
      run: |
        $baseOutputDir = "${{ env.OUTPUT_DIR }}"
        $filesToUpx = @(
            "$baseOutputDir\Launcher.dll",
            "$baseOutputDir\Launcher_2.exe",
            "$baseOutputDir\Plugins\FuFuPlugin\FufuLauncher.UnlockerIsland.dll"
        )
        foreach ($file in $filesToUpx) {
            if (Test-Path $file) {
                upx --best "$file"
            }
        }

    - name: Regenerate hash.txt for modified files
      shell: pwsh
      run: |
        $outputDir = "${{ env.OUTPUT_DIR }}"
        $hashFile = Join-Path $outputDir "Assets\Launcher\hash.txt"
        $captureApp = Join-Path $outputDir "CaptureApp.exe"
        $launcher = Join-Path $outputDir "Launcher.dll"
        
        [string[]]$existingLines = @()
        if (Test-Path $hashFile) {
            $existingLines = Get-Content $hashFile -ErrorAction SilentlyContinue
        }
        
        $line1 = if ($existingLines.Count -gt 0) { $existingLines[0] } else { "" }
        $line2 = if (Test-Path $captureApp) { (Get-FileHash $captureApp -Algorithm SHA512).Hash.ToLower() } else { "" }
        $line3 = if (Test-Path $launcher) { (Get-FileHash $launcher -Algorithm SHA512).Hash.ToLower() } else { "" }
        
        $hashDir = Split-Path $hashFile -Parent
        if (!(Test-Path $hashDir)) { New-Item -ItemType Directory -Force -Path $hashDir | Out-Null }
        
        Set-Content -Path $hashFile -Value @($line1, $line2, $line3)
        Write-Host "Updated hash.txt with UPX compressed file hashes"

    - name: Package Portable ZIP (Green Version)
      shell: pwsh
      run: |
        $outputDir = "${{ env.OUTPUT_DIR }}"
        $zipPath = "FufuLauncher-Portable.zip"
        Compress-Archive -Path "$outputDir\*" -DestinationPath $zipPath -Force

    - name: Upload Portable ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FufuLauncher-Portable
        path: FufuLauncher-Portable.zip

    - name: Compile Inno Setup Script
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" FufuLauncher.Installer\setup.iss'

    - name: Rename Installer and Prepare Release Metadata
      shell: pwsh
      run: |
        $exeFile = Get-ChildItem -Path "FufuLauncher.Installer\installer" -Filter "*.exe" | Select-Object -First 1
        if (-not $exeFile) {
            Write-Error "目录下未找到已打包的exe文件"
            exit 1
        }

        $shortSha = "${{ env.GIT_SHORT_SHA }}"

        if ($exeFile.BaseName -match '(v?\d+(?:\.\d+)+)') {
            $version = $matches[1]
        } else {
            $version = $exeFile.BaseName -replace '^FufuLauncher_Setup_', ''
        }

        $releaseTag = "${version}-${shortSha}"
        $releaseTitle = "preview-${version}-${shortSha}"

        $newExeName = "(preview-${shortSha})$($exeFile.Name)"
        $newExePath = Join-Path $exeFile.DirectoryName $newExeName
        Rename-Item -Path $exeFile.FullName -NewName $newExeName -Force

        Write-Output "EXE_NAME=$([System.IO.Path]::GetFileNameWithoutExtension($newExeName))" >> $env:GITHUB_ENV
        Write-Output "INSTALLER_PATH=$newExePath" >> $env:GITHUB_ENV
        Write-Output "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
        Write-Output "RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV

        Write-Output "### Preview Build Successful" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- **Release Tag**: \`$releaseTag\`" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- **Release Title**: \`$releaseTitle\`" >> $env:GITHUB_STEP_SUMMARY
        Write-Output "- **Generated Installer**: **$newExeName**" >> $env:GITHUB_STEP_SUMMARY

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.EXE_NAME }}
        path: ${{ env.INSTALLER_PATH }}

    - name: Package FuFuPlugin
      shell: pwsh
      run: |
        $pluginDir = "${{ env.OUTPUT_DIR }}\Plugins\FuFuPlugin"
        $stagingDir = "PluginStaging"
        New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
        
        if (Test-Path "$pluginDir\*") {
            Compress-Archive -Path "$pluginDir\*" -DestinationPath "$stagingDir\FuFuPlugin.zip" -Force
            Copy-Item -Path "$stagingDir\FuFuPlugin.zip" -Destination "$stagingDir\FuFuPlugin-old.zip" -Force
            Copy-Item -Path "$stagingDir\FuFuPlugin.zip" -Destination "$stagingDir\FuFuPlugin.vmp.zip" -Force
            Copy-Item -Path "$stagingDir\FuFuPlugin.zip" -Destination "$stagingDir\FuFuPlugin.vmp2.zip" -Force
            
            Compress-Archive -Path "$stagingDir\*.zip" -DestinationPath "FuFuPlugin_Bundle.zip" -Force
        } else {
            Write-Host "FuFuPlugin目录为空或不存在"
            New-Item -ItemType File -Force -Path "FuFuPlugin_Bundle.zip" | Out-Null
        }

    - name: Upload FuFuPlugin Bundle
      uses: actions/upload-artifact@v4
      with:
        name: FuFuPlugin-Bundle
        path: FuFuPlugin_Bundle.zip

    - name: Create GitHub Release in Preview-FufuLauncher
      uses: softprops/action-gh-release@v2
      with:
        repository: ${{ github.repository }}
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TITLE }}
        prerelease: true
        generate_release_notes: true
        files: |
          ${{ env.INSTALLER_PATH }}
          FufuLauncher-Portable.zip
          FuFuPlugin_Bundle.zip
